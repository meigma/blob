name: Go Mod Tidy

on:
  pull_request:

permissions: {}

jobs:
  tidy:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      MOON_TOOLCHAIN_FORCE_GLOBALS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create local default branch
        run: git branch master origin/master

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.6.14
          cache: true

      - name: Run Go module tidy tasks
        run: >-
          env -u CI moon run
          root:tidy
          provenance:tidy
          policy-gittuf:tidy
          policy-opa:tidy
          policy-sigstore:tidy
          policy-slsa:tidy
          --summary minimal

      - name: Verify module files are tidy
        run: git diff --exit-code
