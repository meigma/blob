language: 'go'
layer: 'application'
stack: 'backend'

project:
  title: 'Provenance example'

toolchains:
  default: 'system'

tasks:
  format:
    command: 'golangci-lint fmt --config ../../.golangci.yml --diff'
    options: { cache: false }
  lint:
    command: 'golangci-lint run --config ../../.golangci.yml ./... --show-stats=false'
    options: { cache: false }
  vet:
    command: 'go vet ./...'
    options: { cache: false }
  test:
    command: 'go test -race -cover ./...'
    options: { cache: false }
  build:
    command: 'go build -o provenance .'
    outputs: ['provenance']
    options: { cache: false }
  tidy:
    command: 'go mod tidy'
    options: { cache: false, runInCI: false }
  check:
    deps: ['provenance:format', 'provenance:lint', 'provenance:vet', 'provenance:test', 'provenance:build']
    options: { cache: false, runInCI: true }
