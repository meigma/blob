# mise manages the repository toolchain; Moon remains the task runner and CI gate.
# Keep versions here and resolved downloads in mise.lock in sync.

[tools]
go = "1.25.5"
node = "24.19.0"
flatc = "25.12.19"
"aqua:golangci/golangci-lint" = "2.12.2"
"aqua:moonrepo/moon" = "2.3.5"

[env]
GOTOOLCHAIN = "local"
# Moon's `system` toolchain must resolve the binaries mise puts on PATH instead
# of any Go/Node versions installed globally on a developer machine or runner.
MOON_TOOLCHAIN_FORCE_GLOBALS = "true"

[settings]
lockfile = true
locked = true
