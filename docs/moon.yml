language: 'javascript'
layer: 'application'
stack: 'frontend'
tags:
  - 'docs'
  - 'docusaurus'

project:
  title: 'blob docs'
  description: 'Docusaurus documentation site for blob.'
  owner: 'meigma'
  maintainers:
    - 'meigma'

toolchains:
  default: 'system'

fileGroups:
  configs:
    - 'go.mod'
    - 'package.json'
    - 'package-lock.json'
    - 'docusaurus.config.ts'
    - 'sidebars.ts'
    - 'tsconfig.json'
  sources:
    - 'docs/**/*'
    - 'src/**/*'
    - 'static/**/*'

tasks:
  install:
    command: 'npm ci'
    inputs:
      - 'package.json'
      - 'package-lock.json'
    outputs:
      - 'node_modules/.package-lock.json'
    options:
      cache: false

  typecheck:
    command: 'npm run typecheck'
    deps:
      - 'docs:install'
    inputs:
      - '@group(configs)'
      - '@group(sources)'
    options:
      cache: false

  build:
    command: 'npm run build'
    deps:
      - 'docs:install'
    inputs:
      - '@group(configs)'
      - '@group(sources)'
    outputs:
      - 'build/**/*'

  check:
    deps:
      - 'docs:typecheck'
      - 'docs:build'
    options:
      cache: false
      runInCI: true
