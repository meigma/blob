name: Go Mod Tidy

on:
  pull_request:

permissions: {}

jobs:
  tidy:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOTOOLCHAIN: local
      MOON_TOOLCHAIN_FORCE_GLOBALS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.REPO_PAT }}

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.14
          cache: true

      - name: Run Go module tidy tasks
        run: moon run :tidy --summary minimal

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            go.mod go.sum \
            examples/provenance/go.mod examples/provenance/go.sum \
            policy/gittuf/go.mod policy/gittuf/go.sum \
            policy/opa/go.mod policy/opa/go.sum \
            policy/sigstore/go.mod policy/sigstore/go.sum \
            policy/slsa/go.mod policy/slsa/go.sum
          git diff --staged --quiet || git commit -m "chore: run go mod tidy"
          git push
