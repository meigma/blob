name: Provenance Example

on:
  push:
    branches:
      - master
    paths:
      - 'examples/provenance/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/provenance-example
  GOTOOLCHAIN: local
  MOON_TOOLCHAIN_FORCE_GLOBALS: 'true'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.6.14
          cache: true

      - name: Generate and build provenance CLI
        run: moon run root:generate provenance:build --summary minimal

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push and sign archive
        id: push
        working-directory: examples/provenance
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          # Push and sign with sigstore (keyless), capture output.
          OUTPUT=$(./provenance push --ref "$REF" --sign 2>&1)
          echo "$OUTPUT"

          # Extract digest from the push output.
          DIGEST=$(echo "$OUTPUT" | grep "Digest:" | awk '{print $2}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.3.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Push latest tag
        working-directory: examples/provenance
        run: ./provenance push --ref "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" --sign

  verify:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.6.14
          cache: true

      - name: Generate and build provenance CLI
        run: moon run root:generate provenance:build --summary minimal

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify archive
        working-directory: examples/provenance
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}"
          echo "Pulling with full verification: $REF"
          # Full verification chain:
          # 1. Sigstore verifies who signed the archive.
          # 2. SLSA verifies how the archive was built.
          # 3. Gittuf verifies whether source changes were authorized.
          #
          # PR merge refs do not have Gittuf RSL entries, so skip that layer for PRs.
          GITTUF_FLAG=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Skipping gittuf verification for PR build (PR refs don't have RSL entries)"
            GITTUF_FLAG="--skip-gittuf"
          fi
          ./provenance pull \
            --ref "$REF" \
            --repo "meigma/blob" \
            --output ./verified-output \
            $GITTUF_FLAG

      - name: Verify extraction
        working-directory: examples/provenance
        run: |
          echo "Verifying extracted files..."
          ls -la ./verified-output/
          test -f ./verified-output/config.json
          test -f ./verified-output/README.md
          test -f ./verified-output/data/sample.txt
          echo "All files verified successfully!"
